name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash -el {0}

jobs:
  python-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create Python environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: organoid-segmentation-ci
          python-version: "3.11"
          channels: conda-forge
          conda-remove-defaults: true

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-image scikit-learn tifffile matplotlib

      - name: Compile Python sources
        run: |
          python -m compileall -q analysis utils *.py

      - name: Check nucleus feature contract
        run: |
          python - <<'PY'
          from analysis.features import ORGANOID_CONTEXT_FEATURES, PURE_NUCLEUS_FEATURES

          assert len(PURE_NUCLEUS_FEATURES) == 12
          assert not set(PURE_NUCLEUS_FEATURES) & set(ORGANOID_CONTEXT_FEATURES)
          assert "volume_um3" in PURE_NUCLEUS_FEATURES
          assert "surface_area_um2" in PURE_NUCLEUS_FEATURES
          PY

      - name: Smoke-test feature extractor CLI
        run: python recompute_features_from_cluster_masks.py --help
